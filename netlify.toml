# Vantoris is a React SPA using BrowserRouter.
# Netlify must return the SPA entry point for client-side routes such as
# /login, /operations, /operations/*, /herobox, etc.
# API traffic is intentionally handled by the configured Base44 backend URL,
# not by this Netlify rewrite.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
