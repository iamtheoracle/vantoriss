name: Financial Mutation Quality
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: financial-mutation-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Restore exact locked dependency tree
        run: npm ci
      - name: Financial mutation rule tests
        run: npm run test:financial-mutations
      - name: Lint changed UI files
        run: npx eslint src/pages/admin/AdminApplications.jsx src/pages/admin/AdminAccounts.jsx --quiet
      - name: Set up Deno for server-function validation
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Lint financial mutation server functions
        run: deno lint base44/shared/financialMutationRules.mjs base44/shared/financialMutationGateway.ts base44/functions/reviewApplication/entry.ts base44/functions/correctTransactionDate/entry.ts
      - name: Type-check financial mutation server functions
        run: deno check base44/functions/reviewApplication/entry.ts base44/functions/correctTransactionDate/entry.ts
      - name: Full repository lint
        id: full_lint
        continue-on-error: true
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Report existing repository lint debt
        if: always() && steps.full_lint.outcome == 'failure'
        run: |
          echo "::warning::Full repository lint failed. See the Full repository lint step; do not treat targeted lint as a clean repository."
