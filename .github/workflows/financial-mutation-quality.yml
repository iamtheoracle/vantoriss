name: Financial Mutation Quality
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: financial-mutation-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Restore exact locked dependency tree
        run: npm ci
      - name: Dependency vulnerability audit
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Financial mutation rule tests
        run: npm run test:financial-mutations
      - name: Lint changed UI files
        run: npx eslint src/pages/admin/AdminApplications.jsx src/pages/admin/AdminAccounts.jsx src/pages/operations/BulkTransactionImport.jsx src/pages/operations/VerificationRequests.jsx src/pages/admin/AdminWithdrawals.jsx src/components/vantoris/QuickActionsMenu.jsx src/components/vantoris/FloatingCommandDock.jsx src/pages/admin/AdminMembers.jsx src/pages/AccountDetail.jsx src/components/vantoris/HistoricalStatementImport.jsx --quiet
      - name: Set up Deno for server-function validation
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Lint financial mutation server functions
        run: deno lint base44/shared/financialMutationRules.mjs base44/shared/financialMutationGateway.ts base44/functions/reviewApplication/entry.ts base44/functions/correctTransactionDate/entry.ts base44/functions/bulkImportTransactions/entry.ts base44/functions/reviewFundingRequest/entry.ts base44/functions/processWithdrawalRequest/entry.ts base44/functions/setAccountStatus/entry.ts base44/functions/createMemberAccount/entry.ts base44/functions/createWithdrawalRequest/entry.ts base44/functions/createAdminTransaction/entry.ts
      - name: Type-check financial mutation server functions
        run: deno check base44/functions/reviewApplication/entry.ts base44/functions/correctTransactionDate/entry.ts base44/functions/bulkImportTransactions/entry.ts base44/functions/reviewFundingRequest/entry.ts base44/functions/processWithdrawalRequest/entry.ts base44/functions/setAccountStatus/entry.ts base44/functions/createMemberAccount/entry.ts base44/functions/createWithdrawalRequest/entry.ts base44/functions/createAdminTransaction/entry.ts
      - name: Full repository lint
        id: full_lint
        continue-on-error: true
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Report baseline lint and dependency audit debt
        if: always()
        env:
          FULL_LINT_OUTCOME: ${{ steps.full_lint.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          if [ "$FULL_LINT_OUTCOME" = "failure" ]; then
            echo "::warning::Full repository lint failed. See the Full repository lint step; do not treat targeted lint as a clean repository."
          fi
          if [ "$AUDIT_OUTCOME" = "failure" ]; then
            echo "::warning::Dependency audit reported high-severity advisories. Review the full audit output before changing locked versions."
          fi
      - name: Enforce repository quality gate
        if: always()
        env:
          FULL_LINT_OUTCOME: ${{ steps.full_lint.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          if [ "$FULL_LINT_OUTCOME" != "success" ] || [ "$AUDIT_OUTCOME" != "success" ]; then
            echo "Repository quality gate failed: resolve full lint debt and high-severity dependency advisories before merge."
            exit 1
          fi
