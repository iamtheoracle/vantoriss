name: Vantoris CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: vantoris-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        id: install
        run: npm ci
      - name: Lint changed Vantoris public surface
        run: npx eslint src/App.jsx src/pages/public/InstitutionalSite.jsx src/pages/public/institutionalMedia.js --quiet
      - name: Full repository lint
        run: npm run lint
      - name: Typecheck
        if: always() && steps.install.outcome == 'success'
        run: npm run typecheck
      - name: Production build
        if: always() && steps.install.outcome == 'success'
        run: npm run build
