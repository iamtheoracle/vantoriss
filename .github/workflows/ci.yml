name: Atchison Village CI

on:
  pull_request:
    branches:
      - main
      - feat/atchison-village-unified-rebrand

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avcu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, build and backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Lint changed JavaScript and JSX files
        run: |
          BASE_REF="${{ github.base_ref || 'main' }}"
          git diff --name-only "origin/${BASE_REF}"...HEAD -- '*.js' '*.jsx' | xargs -r npx eslint --quiet

      - name: Full repository lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test Guardian and workflow registry
        run: deno test --no-check base44/shared/runtime/guardian.test.ts base44/shared/registries/WorkflowRegistry.test.ts
