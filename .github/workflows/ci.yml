name: Atchison Village CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: avcu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, build and backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint changed JavaScript and JSX files
        run: git diff --name-only origin/main...HEAD -- '*.js' '*.jsx' | xargs -r npx eslint --quiet

      - name: Report existing full-repository lint backlog
        run: npm run lint
        continue-on-error: true

      - name: Report existing full-app typecheck backlog
        run: npm run typecheck
        continue-on-error: true

      - name: Production build
        run: npm run build

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check backend TypeScript modules
        run: deno check base44/shared/runtime/guardian.ts base44/shared/registries/WorkflowRegistry.ts base44/shared/services/ModelGateway.ts base44/shared/services/ModelService.ts base44/shared/services/WorkflowService.ts base44/functions/oracleRuntime/entry.ts base44/functions/review-recommendation/entry.ts

      - name: Test Guardian and workflow registry
        run: deno test base44/shared/runtime/guardian.test.ts base44/shared/registries/WorkflowRegistry.test.ts
