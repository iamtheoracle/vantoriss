name: Vantoris Baseline Verification

on:
  push:
  workflow_dispatch:

concurrency:
  group: vantoris-baseline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        id: install
        run: npm ci
      - name: Baseline full lint
        run: npm run lint
      - name: Baseline typecheck
        if: always() && steps.install.outcome == 'success'
        run: npm run typecheck
      - name: Baseline production build
        if: always() && steps.install.outcome == 'success'
        run: npm run build
