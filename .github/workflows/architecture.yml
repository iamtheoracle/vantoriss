name: Vantoris Architecture Verification

on:
  push:
    branches:
      - feat/real-banking-provider
  pull_request:
    branches:
      - feat/real-banking-provider

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify agent doctrine and institutional orchestration
        run: npm run test:architecture

      - name: Build application
        run: npm run build
